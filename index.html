<!DOCTYPE html>
<html lang="en-US">
    <head>
        <meta charset="UTF-8">
        <title>Calculator</title>
        <link rel="stylesheet" href="css/styles.css">
        <script src="js/script.js" defer></script>
    </head>
    <body>
        <h1>Basic Calculator</h1>
        <div id="calculator-container">
            <div id="containerTop">
                <input type="text" id="display" placeholder="0" disabled>
                <button id="btnClear">Clear</button>
            </div>
            <div id="containerBottom">
                <div class="input-buttons-left">
                    <button class="btnInput">1</button>
                    <button class="btnInput">2</button>
                    <button class="btnInput">3</button>
                    <button class="btnInput">4</button>
                    <button class="btnInput">5</button>
                    <button class="btnInput">6</button>
                    <button class="btnInput">7</button>
                    <button class="btnInput">8</button>
                    <button class="btnInput">9</button>
                    <button class="btnInput">0</button>
                    <button class="btnEqual">=</button>
                </div>
                <div class="input-buttons-right">
                    <button class="btnInput">+</button>
                    <button class="btnInput">-</button>
                    <button class="btnInput">*</button>
                    <button class="btnInput">/</button>
                </div>
            </div>
        </div>
    </body>
</html>
