<!DOCTYPE html>
<html lang="en-US">
    <head>
        <meta charset="UTF-8">
        <title>Calculator</title>
        <link rel="stylesheet" href="css/styles.css">
        <script src="js/script.js" defer></script>
    </head>
    <body>
        <h1>Basic Calculator</h1>
        <div id="calculator-container">
            <div id="containerTop">
                <input type="text" id="display" placeholder="" disabled>
                <button id="btnClear">Clear</button>
                <button id="btnDelete">Delete</button>
            </div>
            <div id="containerBottom">
                <div class="input-buttons-left">
                    <button class="btnInput btnNumber">1</button>
                    <button class="btnInput btnNumber">2</button>
                    <button class="btnInput btnNumber">3</button>
                    <button class="btnInput btnNumber">4</button>
                    <button class="btnInput btnNumber">5</button>
                    <button class="btnInput btnNumber">6</button>
                    <button class="btnInput btnNumber">7</button>
                    <button class="btnInput btnNumber">8</button>
                    <button class="btnInput btnNumber">9</button>
                    <button class="btnInput btnNumber">0</button>
                    <button class="btnInput btnDecimal">.</button>
                    <button class="btnInput btnEqual">=</button>
                </div>
                <div class="input-buttons-right">
                    <button class="btnInput">+</button>
                    <button class="btnInput">-</button>
                    <button class="btnInput">*</button>
                    <button class="btnInput">/</button>
                </div>
            </div>
        </div>
    </body>
</html>
